---
- name: Check complete vendor evidence for the exact operating system and package owner
  ansible.builtin.set_fact:
    classified_vendor: >-
      {{ classify_evidence.get('advisory_url', '') is match('^https://')
      and classify_evidence.get('checked_at', '') | length > 0
      and classify_evidence.get('channel', '') | length > 0
      and ['CVE-2026-109618', 'CVE-2026-109619'] | difference(classify_evidence.get('cves', [])) | length == 0
      and classify_evidence.get('os_id', '') | string == classify_os.get('ID', 'unknown')
      and classify_evidence.get('os_version', '') | string == classify_os.get('VERSION_ID', 'unknown')
      and classify_evidence.get('packages', {}) | length > 0
      and classify_packages_match and classify_owner in classify_evidence.get('packages', {}) }}
    classified_live: >-
      {{ classify_visibility and classify_processes | length > 0
      and classify_processes | rejectattr('current', 'equalto', true) | list | length == 0 }}

- name: Keep incomplete results unknown
  ansible.builtin.set_fact:
    classified_status: >-
      {{ 'affected' if classified_vendor and classify_evidence.get('status') == 'affected'
      else 'patched' if classified_vendor and classified_live and classify_evidence.get('status') == 'patched'
      else 'unknown' }}

- name: Explain every reason a runtime is not cleared
  ansible.builtin.set_fact:
    classified_reason: >-
      {{ 'Exact affected vendor build' if classified_status == 'affected'
      else 'Vendor package and running artifact evidence verified' if classified_status == 'patched'
      else ((['Vendor, package, OS, or ownership evidence incomplete or mismatched'] if not classified_vendor else [])
      + (classify_gaps | default([]) | map('regex_replace', '^', 'Process visibility gap: ') | list)
      + (['Process visibility incomplete'] if not classify_visibility and classify_gaps | default([]) | length == 0 else [])
      + (['No live instance of the artifact found'] if classify_visibility and classify_processes | length == 0 else [])
      + (['Stale instance still running: pid ' ~ (classify_processes | rejectattr('current', 'equalto', true) | map(attribute='pid') | join(', '))]
      if classify_processes | rejectattr('current', 'equalto', true) | list | length > 0 else [])
      + (['Vendor status is neither patched nor affected'] if classified_vendor and classified_live
      and classify_evidence.get('status') not in ['patched', 'affected'] else [])) | join('; ') }}
