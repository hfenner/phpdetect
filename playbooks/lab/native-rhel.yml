---
- name: Confirm the RHEL guest platform
  ansible.builtin.setup:
    gather_subset: [min]
- name: Require RHEL 9 for the native fixture
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'RedHat'
      - ansible_facts.distribution_major_version == '9'
- name: Install native vendor PHP packages and Apache
  ansible.builtin.dnf:
    name: [php, php-cli, php-fpm, httpd, policycoreutils-python-utils]
    state: present
- name: Allow the loopback lab HTTP port under SELinux
  ansible.builtin.shell: |
    semanage port -a -t http_port_t -p tcp 18080 || semanage port -m -t http_port_t -p tcp 18080
  changed_when: true
- name: Bind the lab website to loopback only
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: "^Listen "
    line: Listen 127.0.0.1:18080
- name: Write a harmless native PHP identification page
  ansible.builtin.copy:
    dest: /var/www/html/index.php
    mode: "0644"
    content: '<?php header("Content-Type: application/json"); echo json_encode(["lab" => "phpdetect", "platform" => "RHEL", "php_version" => PHP_VERSION]);'
- name: Start native PHP-FPM and Apache
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
    enabled: true
  loop: [php-fpm, httpd]
- name: Verify the serving native PHP runtime
  ansible.builtin.uri:
    url: http://127.0.0.1:18080/index.php
    return_content: true
    use_proxy: false
  register: native_rhel_http
  retries: 10
  delay: 3
  until: native_rhel_http.status | default(0) == 200
- name: Verify the native PHP HTTP response
  ansible.builtin.assert:
    that:
      - native_rhel_http.json.lab == 'phpdetect'
      - native_rhel_http.json.php_version is match('^[0-9]+[.][0-9]+[.]')
- name: Record native RHEL fixture readiness
  ansible.builtin.set_fact:
    native_fixture_ready: true
- name: Report the serving RHEL PHP version
  ansible.builtin.debug:
    msg: "RHEL serving PHP {{ native_rhel_http.json.php_version }} through native Apache/PHP-FPM. Vendor patch status requires separate evidence."
