---
- name: Validate the lab container engine
  ansible.builtin.assert:
    that: phpdetect_lab_container_engine | default('podman') in ['podman', 'docker']
- name: Select Podman and podman-compose by default
  ansible.builtin.set_fact:
    lab_engine: "{{ phpdetect_lab_container_engine | default('podman') }}"
    lab_compose: "{{ ['podman-compose'] if phpdetect_lab_container_engine | default('podman') == 'podman' else ['docker', 'compose'] }}"
- name: Check for an existing lab configuration
  ansible.builtin.stat:
    path: /opt/phpdetect-lab/compose.yml
  register: previous_lab
- name: Read the lab engine marker if present
  ansible.builtin.command: cat /opt/phpdetect-lab/container-engine
  register: previous_engine
  changed_when: false
  failed_when: false
- name: Refuse an implicit migration of an existing lab
  ansible.builtin.assert:
    that: not previous_lab.stat.exists or lab_engine == (previous_engine.stdout | trim if previous_engine.rc == 0 else 'docker')
    fail_msg: Existing lab uses another engine (legacy unmarked labs use Docker). Select that engine explicitly or create a separate disposable lab; this playbook does not migrate container stores.
- name: Install the selected container engine and Compose provider
  ansible.builtin.apt:
    name: "{{ ['podman', 'podman-compose'] if lab_engine == 'podman' else ['docker.io', 'docker-compose-v2'] }}"
    state: present
    update_cache: true
  when: phpdetect_lab_install_engine | default(true) | bool
- name: Start Docker only when explicitly selected as the alternative
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: lab_engine == 'docker'
- name: Create the lab content directory
  ansible.builtin.file:
    path: /opt/phpdetect-lab/www
    state: directory
    mode: '0755'
- name: Record the lab engine for safe reruns
  ansible.builtin.copy:
    dest: /opt/phpdetect-lab/container-engine
    content: '{{ lab_engine }}'
    mode: '0644'
- name: Write a harmless runtime identification endpoint
  ansible.builtin.copy:
    dest: /opt/phpdetect-lab/www/index.php
    mode: '0644'
    content: |
      <?php
      header('Content-Type: application/json');
      echo json_encode(['lab' => 'phpdetect', 'php_version' => PHP_VERSION]);
- name: Define pinned official image fixtures
  ansible.builtin.set_fact:
    lab_fixtures:
      - name: vulnerable
        port: 18081
        address: 172.30.77.11
        version: 8.4.26
        image: docker.io/library/php@sha256:60111400ff77bdc44fa79b4f072afe49a42abba71e0846ad496be4761dc9c11a
        intent: unpatched upstream PHP
      - name: patched
        port: 18082
        address: 172.30.77.12
        version: 8.4.27
        image: docker.io/library/php@sha256:a0b75cee7023ba2c127138dcad2ecc6ec7e09435534645e70450f29f24ea2a5a
        intent: fixed upstream control
      - name: unmapped
        port: 18083
        address: 172.30.77.13
        version: 8.4.26
        image: docker.io/library/php@sha256:60111400ff77bdc44fa79b4f072afe49a42abba71e0846ad496be4761dc9c11a
        intent: intentionally lacks an authoritative runtime mapping
    lab_compose_services: {}
    lab_fixture_records: []
    lab_discovery_vars:
      phpdetect_become: true
      phpdetect_container_cli_probe: true
      phpdetect_container_engine: "{{ lab_engine }}"
      phpdetect_runtimes: []
- name: Build restricted Compose service definitions
  ansible.builtin.set_fact:
    lab_compose_services: >-
      {{ lab_compose_services | combine({item.name: {
      'image': item.image,
      'volumes': ['/opt/phpdetect-lab/www:/var/www/html:ro'],
      'restart': 'no', 'read_only': true,
      'tmpfs': ['/tmp', '/var/run/apache2', '/var/lock/apache2'],
      'security_opt': ['no-new-privileges:true'],
      'mem_limit': '384m', 'cpus': 0.5, 'pids_limit': 128,
      'networks': {'isolated': {'ipv4_address': item.address}}}}) }}
  loop: '{{ lab_fixtures }}'
- name: Write the vulnerable starting configuration
  ansible.builtin.copy:
    dest: /opt/phpdetect-lab/compose.yml
    mode: '0644'
    content: >-
      {{ {'name': 'phpdetect-lab', 'services': lab_compose_services,
      'networks': {'isolated': {'internal': true,
      'ipam': {'config': [{'subnet': '172.30.77.0/24'}]}}}} | to_nice_yaml }}
- name: Write the separate fixed configuration for update testing
  ansible.builtin.copy:
    dest: /opt/phpdetect-lab/compose.fixed.yml
    mode: '0644'
    content: >-
      {{ {'name': 'phpdetect-lab', 'services': lab_compose_services | combine({
      'vulnerable': lab_compose_services.vulnerable | combine({'image': lab_fixtures[1].image})}),
      'networks': {'isolated': {'internal': true,
      'ipam': {'config': [{'subnet': '172.30.77.0/24'}]}}}} | to_nice_yaml }}
- name: Start the lab fixtures with their immutable images
  ansible.builtin.command:
    argv: "{{ lab_compose + ['-f', '/opt/phpdetect-lab/compose.yml', 'up', '-d', '--no-build'] }}"
  register: lab_compose_start
  changed_when: "'Started' in lab_compose_start.stderr or 'Created' in lab_compose_start.stderr or 'Recreated' in lab_compose_start.stderr"
# No host ports are published for the internal-only network. A host-side
# nginx listener provides loopback access while containers remain egress-isolated.
- name: Install the host-side loopback proxy
  ansible.builtin.apt:
    name: nginx
    state: present
    policy_rc_d: 101
- name: Remove the stock public nginx listener on this disposable host
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
- name: Configure loopback-only access to the isolated fixture addresses
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/phpdetect-lab-proxy.conf
    mode: '0644'
    content: |
      {% for fixture in lab_fixtures %}
      server {
        listen 127.0.0.1:{{ fixture.port }};
        server_name localhost;
        location / {
          proxy_pass http://{{ fixture.address }}:80;
        }
      }
      {% endfor %}
- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
- name: Start the loopback proxy
  ansible.builtin.service:
    name: nginx
    state: restarted
    enabled: true
- name: Verify the actual PHP version serving HTTP for every fixture
  ansible.builtin.uri:
    url: 'http://127.0.0.1:{{ item.port }}/'
    return_content: true
    use_proxy: false
  register: lab_http
  until: lab_http.status | default(0) == 200
  retries: 10
  delay: 2
  loop: '{{ lab_fixtures }}'
- name: Reject any fixture with an unexpected serving build
  ansible.builtin.assert:
    that:
      - item.json.lab == 'phpdetect'
      - item.json.php_version == item.item.version
  loop: '{{ lab_http.results }}'
  loop_control:
    label: '{{ item.item.name }}'
- name: Record fixture intent without substituting it for detector evidence
  ansible.builtin.set_fact:
    lab_fixture_records: '{{ lab_fixture_records + [item | combine({"discovery_expected": "unknown"})] }}'
  loop: '{{ lab_fixtures }}'
- name: Write a separate remediation test plan for the Docker alternative
  ansible.builtin.copy:
    dest: /opt/phpdetect-lab/container-update-vars.yml
    mode: '0600'
    content: |
      phpdetect_become: true
      phpdetect_update:
        kind: docker_compose
        change_id: "lab-{{ phpdetect_lab_id }}-fix"
        compose_file: /opt/phpdetect-lab/compose.fixed.yml
        compose_service: vulnerable
        image: {{ lab_fixtures[1].image }}
        evidence:
          image: {{ lab_fixtures[1].image }}
          advisory_url: https://www.php.net/archive/2026.php#2026-10-21-5
          checked_at: '2026-10-22'
          cves: [CVE-2026-109618, CVE-2026-109619]
        health_checks:
          - url: http://127.0.0.1:18081/
            run_from: {{ inventory_hostname }}
            status_code: 200
  when: lab_engine == 'docker'
