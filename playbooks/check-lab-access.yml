---
- name: Check AAP execution and AWS lab access without provisioning
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Identify the injected AWS account
      amazon.aws.aws_caller_info:
      register: lab_caller
      no_log: true
    - name: Require the expected account when supplied
      ansible.builtin.assert:
        that: lab_caller.account == phpdetect_expected_aws_account | string
      when: phpdetect_expected_aws_account is defined
    - name: Read the execution node public egress address
      ansible.builtin.uri:
        url: https://checkip.amazonaws.com/
        return_content: true
        validate_certs: true
      register: lab_egress
    - name: Require an IPv4 address for the lab SSH rule
      ansible.builtin.assert:
        that: lab_egress.content | trim is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}$')
    - name: Read public identities from the injected SSH agent
      ansible.builtin.command: ssh-add -L
      register: lab_agent
      changed_when: false
      failed_when: false
      no_log: true
    - name: Read existing regional EC2 public keys
      amazon.aws.ec2_key_info:
        region: '{{ phpdetect_lab_region | default("us-east-1") }}'
        include_public_key: true
      register: lab_keys
      no_log: true
    - name: Initialize matching key names
      ansible.builtin.set_fact:
        lab_matching_keys: []
    - name: Match public key material without exposing private credentials
      ansible.builtin.set_fact:
        lab_matching_keys: '{{ lab_matching_keys + [item.key_name] }}'
      loop: '{{ lab_keys.keypairs }}'
      when:
        - lab_agent.rc == 0
        - item.public_key | default('') | length > 0
        - (item.public_key | regex_search('^[^ ]+ [^ ]+')) in (lab_agent.stdout_lines | map('regex_search', '^[^ ]+ [^ ]+') | list)
      no_log: true
    - name: Retain non-secret readiness information
      ansible.builtin.set_stats:
        per_host: false
        aggregate: false
        data:
          phpdetect_lab_readiness:
            account: '{{ lab_caller.account }}'
            region: '{{ phpdetect_lab_region | default("us-east-1") }}'
            ssh_cidr: '{{ lab_egress.content | trim }}/32'
            matching_key_names: '{{ lab_matching_keys }}'
            ssh_agent_available: '{{ lab_agent.rc == 0 }}'
    - name: Require a usable existing EC2 key pair
      ansible.builtin.assert:
        that: lab_matching_keys | length > 0
        fail_msg: AWS access works, but the injected SSH key does not match an existing regional EC2 key pair. Select matching credentials and key pair before building.
