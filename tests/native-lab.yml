---
- name: Check native lab isolation without creating cloud resources
  hosts: localhost
  gather_facts: false
  vars:
    native: '{{ (lookup("file", playbook_dir ~ "/../playbooks/build-native-lab-aws.yml") | from_yaml)[0].vars.native_stack_template }}'
  tasks:
    - ansible.builtin.assert:
        that:
          - native.Resources.SecurityGroup.Properties.SecurityGroupIngress | length == 1
          - native.Resources.SecurityGroup.Properties.SecurityGroupIngress[0].FromPort == 22
          - native.Resources.SecurityGroup.Properties.SecurityGroupIngress[0].ToPort == 22
          - native.Resources.Rhel.Properties.MetadataOptions.HttpTokens == 'required'
          - native.Resources.Windows.Properties.MetadataOptions.HttpTokens == 'required'
          - native.Resources.Rhel.Properties.BlockDeviceMappings[0].Ebs.Encrypted
          - native.Resources.Windows.Properties.BlockDeviceMappings[0].Ebs.Encrypted
          - "'IamInstanceProfile' not in native.Resources.Rhel.Properties"
          - "'IamInstanceProfile' not in native.Resources.Windows.Properties"
