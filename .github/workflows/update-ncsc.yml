name: Update bundled NCSC lists

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ncsc
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Install Ansible
        run: pip install 'ansible-core==2.19.14'
      - name: Refresh snapshot from NCSC main
        run: ansible-playbook playbooks/refresh-ncsc.yml
      - name: Commit changed snapshot
        run: |
          set -euo pipefail
          git add -- data/ncsc/snapshot.json
          if git diff --cached --quiet; then
            echo 'NCSC snapshot is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh bundled NCSC product lists'
          git push origin HEAD
