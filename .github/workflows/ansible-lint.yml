name: Ansible lint
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ansible-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint tools
        run: pip install 'ansible-core>=2.19,<2.20' 'ansible-lint==26.10.1'
      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Lint all Ansible content
        run: ansible-lint --offline --strict
