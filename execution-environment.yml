---
version: 3
images:
  base_image:
    name: registry.access.redhat.com/ubi9/ubi:latest
dependencies:
  galaxy: requirements.yml
  python:
    - boto3>=1.35.0
    - botocore>=1.35.0
  python_interpreter:
    package_system: python3.12
    python_path: /usr/bin/python3.12
  ansible_core:
    package_pip: ansible-core>=2.19,<2.20
  ansible_runner:
    package_pip: ansible-runner>=2.4,<3
  system:
    - git-core
    - openssh-clients
    - sshpass
    - rsync
    - findutils
    - tar
    - gzip
    - procps-ng
    - hostname
additional_build_steps:
  append_base:
    - RUN $PKGMGR install -y python3.12-pip && $PKGMGR clean all
  append_final:
    - LABEL org.opencontainers.image.source="https://github.com/hfenner/phpdetect"
    - LABEL org.opencontainers.image.title="phpdetect execution environment"
    - LABEL org.opencontainers.image.description="Unofficial Ansible PHP detection PoC; custom EE for AAP 2.7"
options:
  user: '1000'
