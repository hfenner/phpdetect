---
- name: Read credential metadata without displaying secrets
  ansible.builtin.uri:
    url: '{{ aap_api }}/credentials/{{ lab_credential.id }}/'
  register: lab_credential_details
  no_log: true
- name: Read the credential type
  ansible.builtin.uri:
    url: '{{ aap_api }}/credential_types/{{ lab_credential_details.json.credential_type }}/'
  register: lab_credential_type
  no_log: true
- name: Require the expected credential plugin and type category
  ansible.builtin.assert:
    that:
      - lab_credential_details.json.kind == lab_credential.kind
      - lab_credential_type.json.kind == ('cloud' if lab_credential.kind == 'aws' else 'ssh')
    fail_msg: The supplied credential ID has the wrong type; expected {{ lab_credential.kind }}.
